<VirtualHost *:80>
    ServerName ganti-domain-anda.com
    ServerAlias www.ganti-domain-anda.com
    DocumentRoot /var/www/ciptacms/public
    <Directory /var/www/ciptacms/public>
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/ciptacms-error.log
    CustomLog ${APACHE_LOG_DIR}/ciptacms-access.log combined
</VirtualHost>
# HTTPS: `a2enmod ssl rewrite proxy proxy_http && certbot --apache -d ganti-domain-anda.com`
# WAJIB: matikan/tidak-bawa file proxy Node (wanode.conf) — Sprint 503 lokal disebabkan ProxyPass global ke backend mati.
